<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maestro Recovery</title>
    <style>
      /*
       * This window loads before (and without) the app's styles, under a strict CSP, so the
       * palette is copied here as literal values from the generated theme
       * (packages/theme/src/__generated__/semantic.css): the dark slate ground and jade
       * primary, mirrored for light. Keep them in step with the theme when it changes.
       */
      :root {
        color-scheme: dark;
        --bg: color(display-p3 0.0758 0.0995 0.1141);
        --well: color(display-p3 0.1102 0.1366 0.153);
        --hover: color(display-p3 0.1272 0.1559 0.1737);
        --fg: color(display-p3 0.9269 0.9366 0.9426);
        --muted: color(display-p3 0.6616 0.6866 0.7023);
        --passive: color(display-p3 0.5171 0.5499 0.5704);
        --error: color(display-p3 0.871 0.4316 0.4136);
        --ring: color(display-p3 0.3562 0.5739 0.5124);
        --primary: color(display-p3 0.4372 0.7152 0.6375);
        --primary-hover: color(display-p3 0.4983 0.7651 0.6888);
        --primary-ink: color(display-p3 0.125 0.125 0.125);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        font-size: 13px;
        line-height: 1.55;
        background: var(--bg);
        color: var(--fg);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: color(display-p3 0.9888 0.9947 0.9984);
          --well: color(display-p3 0.9596 0.9692 0.9753);
          --hover: color(display-p3 0.9355 0.9475 0.9551);
          --fg: color(display-p3 0.0743 0.0944 0.1069);
          --muted: color(display-p3 0.2692 0.2967 0.3139);
          --passive: color(display-p3 0.3989 0.4282 0.4464);
          --error: color(display-p3 0.8394 0.4028 0.3867);
          --ring: color(display-p3 0.2944 0.5701 0.497);
          --primary: color(display-p3 0.1887 0.4494 0.3839);
          --primary-hover: color(display-p3 0.15 0.3953 0.3349);
          --primary-ink: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 440px);
      }
      .dot {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: var(--error);
      }
      h1 {
        margin: 20px 0 0;
        font-size: 26px;
        line-height: 1.3;
        font-weight: 500;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }
      #status {
        min-height: 18px;
        margin-top: 20px;
        font-size: 12px;
        color: var(--passive);
        font-variant-numeric: tabular-nums;
      }
      progress {
        display: block;
        width: 100%;
        height: 4px;
        margin: 10px 0 0;
        border: 0;
        border-radius: 9999px;
        background: var(--well);
        appearance: none;
        overflow: hidden;
      }
      progress[hidden] {
        display: none;
      }
      progress::-webkit-progress-bar {
        background: var(--well);
      }
      progress::-webkit-progress-value {
        background: var(--muted);
        border-radius: 9999px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        margin-top: 20px;
      }
      button {
        height: 32px;
        border: 0;
        border-radius: 8px;
        padding: 0 12px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: default;
        transition:
          background-color 150ms,
          color 150ms;
      }
      button:hover {
        background: var(--hover);
        color: var(--fg);
      }
      button.primary {
        margin-right: 8px;
        background: var(--primary);
        color: var(--primary-ink);
        font-weight: 500;
      }
      button.primary:hover {
        background: var(--primary-hover);
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }
      button:disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      details {
        margin-top: 36px;
      }
      summary {
        width: fit-content;
        border-radius: 6px;
        color: var(--muted);
        cursor: default;
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::before {
        content: '\203A';
        display: inline-block;
        width: 14px;
        color: var(--passive);
        transition: transform 150ms;
      }
      details[open] summary::before {
        transform: rotate(90deg);
      }
      summary:hover {
        color: var(--fg);
      }
      pre {
        max-height: 140px;
        margin: 8px 0 0;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--well);
        color: var(--muted);
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        user-select: text;
      }
      footer {
        margin-top: 24px;
        font-size: 11px;
        color: var(--passive);
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="dot" aria-hidden="true"></span>
      <h1>Maestro couldn’t start</h1>
      <p>
        Something stopped the app before it finished opening. Check for an update, restart Maestro,
        or open the logs to see what happened.
      </p>
      <div id="status" role="status"></div>
      <progress id="progress" max="100" value="0" hidden></progress>
      <div class="actions">
        <button id="update" class="primary">Check for updates</button>
        <button onclick="navigate('restart')">Restart Maestro</button>
        <button onclick="navigate('open-logs')">Open logs</button>
        <button onclick="navigate('quit')">Quit</button>
      </div>
      <details id="error-details">
        <summary>Error details</summary>
        <pre id="error"></pre>
      </details>
      <footer id="version"></footer>
    </main>
    <script>
      // Bootstrap state is injected synchronously by main before loadURL.
      // The sentinel below is replaced with a JSON literal at build time by
      // recovery-window.ts so there is no async round-trip on first render.
      var state = __RECOVERY_BOOTSTRAP__;

      var statusEl = document.querySelector('#status');
      var progressEl = document.querySelector('#progress');
      var updateBtn = document.querySelector('#update');
      var errorEl = document.querySelector('#error');
      var errorDetails = document.querySelector('#error-details');
      var versionEl = document.querySelector('#version');

      function navigate(action) {
        window.location.href = 'emdash-recovery://' + action;
      }

      window.renderState = function (next) {
        state = next;
        errorEl.textContent = next.errorMessage || '';
        versionEl.textContent = 'Version ' + next.version;

        // Auto-expand error details whenever an error message is present.
        if (next.errorMessage) {
          errorDetails.open = true;
        }

        progressEl.hidden = next.updateStatus !== 'downloading';
        progressEl.value = next.downloadProgress || 0;

        updateBtn.disabled =
          !next.updaterActive ||
          next.updateStatus === 'checking' ||
          next.updateStatus === 'downloading' ||
          next.updateStatus === 'installing';

        switch (next.updateStatus) {
          case 'available':
            statusEl.textContent = 'Version ' + next.availableVersion + ' is available.';
            updateBtn.textContent = 'Download update';
            break;
          case 'downloading':
            statusEl.textContent =
              'Downloading update\u2026 ' + Math.round(next.downloadProgress || 0) + '%';
            updateBtn.textContent = 'Downloading\u2026';
            break;
          case 'downloaded':
            statusEl.textContent = 'Version ' + next.availableVersion + ' is ready to install.';
            updateBtn.textContent = 'Install and restart';
            break;
          case 'checking':
            statusEl.textContent = 'Checking for updates\u2026';
            updateBtn.textContent = 'Checking\u2026';
            break;
          case 'installing':
            statusEl.textContent = 'Installing update\u2026';
            updateBtn.textContent = 'Installing\u2026';
            break;
          case 'error':
            statusEl.textContent = next.error || 'The update check failed.';
            updateBtn.textContent = 'Check again';
            break;
          default:
            statusEl.textContent = next.updaterActive
              ? 'Recovery mode is ready.'
              : 'Automatic updates are unavailable in this build.';
            updateBtn.textContent = 'Check for updates';
        }
      };

      // Update button cycles: check → download → install based on current state.
      updateBtn.addEventListener('click', function () {
        var action =
          state.updateStatus === 'available'
            ? 'download'
            : state.updateStatus === 'downloaded'
              ? 'install'
              : 'check';
        navigate(action);
      });

      // Render initial state synchronously from the injected bootstrap payload.
      window.renderState(state);
    </script>
  </body>
</html>
